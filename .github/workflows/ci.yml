name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - run: VITE_STUDENT_ONLY=true npm run build
      - uses: actions/upload-artifact@v4
        with: { name: student-static-demo, path: dist }

  deploy-pages:
    # Публичное статическое демо ученика: официальный путь GitHub Pages (artifact → deploy-pages).
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { VITE_STUDENT_ONLY: 'true', VITE_BUILD_SHA: '${{ github.sha }}' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check that the site serves this build
        run: |
          for i in $(seq 1 30); do
            sha=$(curl -fsS "${{ steps.deployment.outputs.page_url }}version.json?t=$(date +%s)" | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            [ "$sha" = "${{ github.sha }}" ] && echo "live: $sha" && exit 0
            sleep 10
          done
          echo "site still serves $sha, expected ${{ github.sha }}"; exit 1
